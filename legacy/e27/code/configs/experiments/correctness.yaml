# Correctness experiment — small-scale validation (20 slots, 10 providers, 8 tasks)
# Used for smoke testing and CI

simulation:
  T: 20
  log_level: "full"

providers:
  N_mean: 10
  max_processing_rate: [8.0, 15.0]
  alpha: [0.05, 0.15]
  beta: [0.02, 0.08]
  zeta: [0.65, 0.90]
  omega: [0.05, 0.20]
  xi: [0.06, 0.10]
  delta: [0.02, 0.04]
  outside_option: 0.01
  initial_H: 0.1
  initial_stage: "cultivation"

tasks:
  M_mean: 8
  cpu_cycles: [0.2, 1.0]
  input_size: [0.1, 1.5]
  output_size: [0.05, 0.8]
  deadline_factor: [1.2, 2.5]
  min_quality: [0.65, 0.85]
  q_bar: [0.90, 0.95]
  kappa: [1.5, 4.0]
  value_base: [1.0, 4.0]

contract:
  p_min: 0.05
  p_max: 0.80
  D_bar: 8.0
  reinforcement_margin: 0.05

path_state:
  Theta_M: 0.75
  Theta_C: 0.55
  s_M: 0.80
  s_C: 0.65
  K: 5
  delta_p_max: 0.05

matching:
  budget_ratio: 0.70
  max_iter: 50
  budget_tol: 1.0e-4
  stagnation_limit: 5
  initial_lambda_B: 0.1
  step_scale: 0.1

prime:
  eta_H: 5.0
  use_path_dependence: true
  use_probability_weighting: true

experiments:
  seeds_main: 3
  seeds_smoke: 3
