# Experiment D: Ablation study (Section 12.4)
# PRIME vs its five ablated variants on the same dataset & budget.

simulation:
  T: 1000
  log_level: "selected"
  save_logs: [slot, provider]

sweep:
  methods: [PRIME, PRIME-w/o-PD, PRIME-w/o-PW, PRIME-w/o-LT, PRIME-w/o-RC, PRIME-Fixed]
  seeds: 30
  variations:
    - name: stationary
      overrides:
        dataset: {pattern: stationary}
